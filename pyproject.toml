[project]
name = "rotation-fit"
version = "0.2.0"
description = "Predicts the probability that an employee succeeds after a job rotation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
keras = ["tensorflow>=2.15"]
dev = ["pytest>=8", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6"]

[tool.setuptools]
packages = ["rotation_fit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
